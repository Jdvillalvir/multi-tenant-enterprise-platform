name: CI
on: [push,pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: app_password, POSTGRES_USER: app, POSTGRES_DB: multitenant}
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U app -d multitenant" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://app:app_password@localhost:5432/multitenant
      AUTH_SECRET: ci-secret-at-least-32-characters-long
      AUTH_URL: http://127.0.0.1:3000
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: tenant-files
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      MAX_FILE_SIZE: 10485760
      SEED_ADMIN_EMAIL: admin@example.local
      SEED_ADMIN_PASSWORD: TestPassword123!secure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
